<!doctype html>
<!--
  Source for /og.png (1200×630) and /apple-touch-icon.png (180×180).
  Serve the repository root, open /tools/cards.html, and screenshot
  #og and #touch at device scale 1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cards</title>
<link rel="stylesheet" href="/site.css">
<style>
  body { margin: 0; background: #ccc; }
  .card {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    margin-bottom: 40px;
  }
  #og { width: 1200px; height: 630px; }
  #og .name {
    position: absolute;
    left: 96px;
    top: 84px;
    font-size: 34px;
    font-weight: 600;
  }
  #og .lede {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 220px;
    font-family: "AC Display", var(--serif);
    font-size: 64px;
    line-height: 1.16;
    letter-spacing: -0.01em;
  }
  #og .lede span { color: var(--muted); }
  #og .url {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 72px;
    padding-top: 20px;
    border-top: 2px solid var(--rule);
    font-size: 26px;
    color: var(--muted);
  }
  #touch { width: 180px; height: 180px; display: grid; place-items: center; }
  #touch img { width: 128px; height: 128px; }
</style>
</head>
<body>
  <div class="card" id="og">
    <p class="name">Alp Cetin</p>
    <p class="lede">I’m building Tenth Man Labs.<br><span>My background is GPU systems.</span></p>
    <p class="url">mottopanikeiku.github.io</p>
  </div>
  <div class="card" id="touch"><img src="/favicon.svg" alt=""></div>
</body>
</html>
