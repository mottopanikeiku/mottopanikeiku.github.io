name: Site
on:
  push:
    branches: [main, night2-site]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML
        run: npx --yes html-validate@9 --rule 'doctype-style:off' index.html 404.html projects/*/index.html
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.58.0 pypdf==6.8.0
          python -m playwright install --with-deps chromium
          curl --fail --location https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js --output "$RUNNER_TEMP/axe.min.js"
      - name: Check accessibility and print
        env:
          AXE_PATH: ${{ runner.temp }}/axe.min.js
        run: python tools/check_site.py --output "$RUNNER_TEMP/site-checks"
      - uses: actions/upload-artifact@v4
        with:
          name: site-checks
          path: ${{ runner.temp }}/site-checks
      - name: Build Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
