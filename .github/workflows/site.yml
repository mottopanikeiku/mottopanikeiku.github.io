name: Site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate HTML
        run: npx --yes html-validate@9 --rule 'doctype-style:off' index.html 404.html projects/*/index.html
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.58.0 pypdf==6.8.0
          python -m playwright install --with-deps chromium
          curl --fail --location https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js --output "$RUNNER_TEMP/axe.min.js"
          echo "880970c081707360e64f34cea25ff91892f5bc95675b0776925b9709dd8a68bb  $RUNNER_TEMP/axe.min.js" | sha256sum --check
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check accessibility and print
        env:
          AXE_PATH: ${{ runner.temp }}/axe.min.js
        run: python tools/check_site.py --output "$RUNNER_TEMP/site-checks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-checks
          path: ${{ runner.temp }}/site-checks
